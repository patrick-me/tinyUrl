version: '3.9'

services:
  tinyurl:
    container_name: tinyurl_app
    build:
      context: ./
      dockerfile: docker/tinyurl/Dockerfile
    restart: always
    environment:
      APP_PORT: ":8080"
      DEFAULT_URL_LEN: 10
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      DEFAULT_STORAGE_EXPIRATION_HOURS: 720
      TINY_HOST: "http://localhost"
    ports:
      - "80:8080"
    networks:
      - tinyurl-net
    depends_on:
      - redis
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  redis:
    container_name: tinyurl_redis
    # Valkey speaks the Redis protocol, has no modules and is ~17 MB.
    # Its data files are not compatible with Redis 8, hence the new volume
    # (see "Upgrading from the Redis 8 image" in the README).
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes #saving written data to volume
    hostname: redis
    restart: always
    volumes:
      - valkey-data:/data
    networks:
      - tinyurl-net
    logging: *logging


volumes:
  valkey-data:
    driver: local


networks:
  tinyurl-net:
    name: tinyurl-net